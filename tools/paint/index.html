<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<title>paint</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  /* The paint page. tools/paint-art.mjs opens it in the installed Chrome (so WebGL runs on the
     GPU), calls window.paint(job) once and screenshots the canvas. The shipped site never
     loads this page; it is where the stills are made from the same shader as the live art. */
  import { createEngine } from '/src/art/engine.js';
  import { scene } from '/src/art/presets.js';

  window.paint = (job) => {
    const c = document.getElementById('c');
    c.width = job.w;
    c.height = job.h;
    const eng = createEngine(c, { lite: !!job.lite });
    if (!eng) throw new Error('this browser has no WebGL2');
    eng.resize(job.w, job.h);
    eng.setScene(scene(job.mood, job.shot, job.over || {}));
    eng.draw(job.time || 0, job.wipes || null);
    eng.gl.finish();
    const info = eng.gl.getExtension('WEBGL_debug_renderer_info');
    return { renderer: info ? eng.gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : 'unknown' };
  };
  window.__ready = true;
</script>
</body>
</html>
